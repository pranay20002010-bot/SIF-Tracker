name: Update SIF NAVs

on:
  schedule:
    - cron: "30 17 * * 1-6"   # 23:00 IST, Mon–Sat (AMFI posts NAVs by ~11 pm)
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy
      - run: python streamlit_app.py --update
      - name: Commit updated history
        run: |
          git config user.name "sif-bot"
          git config user.email "sif-bot@users.noreply.github.com"
          git add data/sif_nav_history.csv
          git diff --cached --quiet || git commit -m "SIF NAV update $(date +%F)"
          git push
